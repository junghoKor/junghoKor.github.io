<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>방명록</title>
  <style>
    body { background:#121212; color:#e0e0e0; font-family:'Malgun Gothic',sans-serif; margin:0; padding:20px; }
    h1 { font-size:22px; color:#fff; margin-bottom:24px; text-align:center; }
    .container { max-width:560px; margin:0 auto; position:relative; }
    .form-box { background:#1e1e1e; padding:20px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.6); margin-bottom:40px; }
    label { display:block; margin:12px 0 6px; font-size:14px; color:#ccc; }
    input, textarea { width:100%; background:#2a2a2a; border:1px solid #444; border-radius:8px; padding:10px; color:#eee; font-size:14px; box-sizing:border-box; }
    textarea { min-height:90px; resize:vertical; }
    button { margin-top:12px; padding:12px; width:100%; background:#555; color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
    button:hover { background:#777; }
    .entry { background:#1a1a1a; padding:16px; border-radius:10px; margin-bottom:14px; border-left:4px solid #555; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .name { font-weight:bold; color:#fff; font-size:15px; }
    .controls { display:flex; gap:6px; align-items:center; }
    .pw { width:80px; padding:5px; font-size:12px; background:#333; border:1px solid #555; border-radius:4px; color:#fff; }
    .del { background:#c62828; color:white; border:none; padding:5px 10px; border-radius:5px; font-size:12px; cursor:pointer; }
    .del:hover { background:#e53935; }
    .message { font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
    .pagination { text-align:center; margin:30px 0; }
    .pagination button { background:#2a2a2a; color:#eee; border:1px solid #444; width:36px; height:36px; margin:0 4px; border-radius:6px; cursor:pointer; font-size:13px; }
    .pagination button:hover { background:#444; }
    .pagination button.active { background:#666; border-color:#888; }
    .info { font-size:13px; color:#888; text-align:center; margin-top:50px; }
  </style>
</head>
<body>

<div class="container">
  <h1>방명록</h1>

  <div class="form-box">
    <label>별명</label>
    <input type="text" id="name" placeholder="예: 홍길동" maxlength="20" />
    
    <label>남기고 싶은 말</label>
    <textarea id="message" placeholder="따뜻한 한마디 부탁드려요" maxlength="300"></textarea>
    
    <label>비밀번호 (삭제 시 필요)</label>
    <input type="password" id="password" placeholder="4~20자, 꼭 기억하세요!" maxlength="20" />
    
    <button onclick="submitEntry()">방명록 남기기</button>
  </div>

  <div id="entries"></div>
  <div class="pagination" id="pagination"></div>
  <div class="info">현재 <span id="total">0</span>개의 방명록이 있습니다</div>
</div>

<script type="module">
  import { db, ref, push, remove, onValue } from './guestbook_cdn.js';

  const entriesRef = ref(db, 'guestbook');
  let allEntries = [];
  let currentPage = 1;
  const perPage = 10;

  window.submitEntry = () => {
    const name = document.getElementById('name').value.trim();
    const message = document.getElementById('message').value.trim();
    const password = document.getElementById('password').value;

    if (!name || !message || password.length < 4) {
      alert('모든 항목을 올바르게 입력해주세요.\n비밀번호는 4자 이상이어야 합니다.');
      return;
    }

    push(entriesRef, { name, message, password, timestamp: Date.now() })
      .then(() => {
        document.getElementById('name').value = '';
        document.getElementById('message').value = '';
        document.getElementById('password').value = '';
      })
      .catch(() => alert('작성에 실패했습니다. 다시 시도해주세요.'));
  };

  onValue(entriesRef, (snap) => {
    const data = snap.val() || {};
    allEntries = Object.entries(data)
      .map(([key, value]) => ({ key, ...value }))
      .sort((a, b) => b.timestamp - a.timestamp);

    document.getElementById('total').textContent = allEntries.length;
    render();
  });

  function render() {
    const start = (currentPage - 1) * perPage;
    const pageData = allEntries.slice(start, start + perPage);

    const container = document.getElementById('entries');
    container.innerHTML = '';

    pageData.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <div class="header">
          <div class="name"></div>
          <div class="controls">
            <input type="password" class="pw" placeholder="비밀번호" autocomplete="off" />
            <button class="del">삭제</button>
          </div>
        </div>
        <div class="message"></div>
      `;

      div.querySelector('.name').textContent = entry.name;
      div.querySelector('.message').textContent = entry.message;

      div.querySelector('.del').onclick = () => {
        const inputPw = div.querySelector('.pw').value.trim();
        if (!inputPw) return alert('비밀번호를 입력해주세요.');

        if (!confirm('정말로 삭제하시겠습니까?')) return;

        const entryRef = ref(db, `guestbook/${entry.key}`);
        remove(entryRef)
          .then(() => {
            alert('삭제되었습니다.');
          })
          .catch(() => {
            alert('비밀번호가 틀립니다.');
          });
      };

      container.appendChild(div);
    });

    renderPagination();
  }

  function renderPagination() {
    const totalPages = Math.ceil(allEntries.length / perPage) || 1;
    const el = document.getElementById('pagination');
    el.innerHTML = '';

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      if (i === currentPage) btn.classList.add('active');
      btn.onclick = () => {
        currentPage = i;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      el.appendChild(btn);
    }
  }
</script>

</body>
</html>
