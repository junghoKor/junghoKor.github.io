<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>방명록</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      position: relative;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .entries-container {
      width: 500px;
    }
    .form-container {
      position: absolute;
      left: 600px;
      top: 20px;
      background-color: #1e1e1e;
      padding: 16px;
      border-radius: 8px;
      width: 260px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 13px;
      margin-bottom: 4px;
      color: #ccc;
    }
    .form-group input,
    .form-group textarea {
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 8px;
      font-size: 13px;
      color: #eee;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .form-container button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    .form-container button:hover {
      background-color: #666;
    }
    .entry {
      width: 500px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entry-name {
      font-weight: bold;
      font-size: 15px;
      color: #fff;
    }
    .entry-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .pw-input {
      width: 60px;
      background-color: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px;
      font-size: 12px;
    }
    .entry-message {
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.4;
    }
    .pagination {
      margin-top: 20px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pagination button {
      width: 28px;
      height: 28px;
      padding: 0;
      text-align: center;
      background-color: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .pagination button:hover {
      background-color: #555;
    }
    .pagination button.active {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="entries-container">
    <h1>방명록</h1>
    <div id="entries"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="form-container">
    <div class="form-group">
      <label for="name">별명</label>
      <input type="text" id="name" placeholder="예: 홍길동" />
    </div>
    <div class="form-group">
      <label for="message">내용</label>
      <textarea id="message" placeholder="방명록 메시지를 입력하세요"></textarea>
    </div>
    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="삭제 시 필요한 비밀번호" />
    </div>
    <button onclick="submitEntry()">등록</button>
  </div>

  <script type="module">
    import { db, ref, push, update, remove, onValue } from './guestbook_cdn.js';

    const entriesRef = ref(db, 'guestbook');
    let allEntries = [];
    let currentPage = 1;
    const entriesPerPage = 10;

    window.submitEntry = () => {
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !message || !password) {
        alert("별명, 내용, 비밀번호를 모두 입력해주세요.");
        return;
      }

      push(entriesRef, { name, message, password });
      document.getElementById('name').value = '';
      document.getElementById('message').value = '';
      document.getElementById('password').value = '';
    };

    onValue(entriesRef, (snapshot) => {
      const data = snapshot.val();
      allEntries = [];
      for (const key in data) {
        allEntries.push({ key, ...data[key] });
      }
      allEntries.reverse();
      renderPage(currentPage);
      renderPagination();
    });

    function renderPage(page) {
      const start = (page - 1) * entriesPerPage;
      const end = start + entriesPerPage;
      const entries = allEntries.slice(start, end);

      const container = document.getElementById('entries');
      container.innerHTML = '';

      entries.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `
          <div class="entry-header">
            <div class="entry-name">${entry.name}</div>
            <div class="entry-controls">
              <input type="password" id="pw-${entry.key}" class="pw-input" placeholder="PW" />
              <button onclick="deleteEntry('${entry.key}')">삭제</button>
            </div>
          </div>
          <div class="entry-message">${entry.message}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(allEntries.length / entriesPerPage);
      const container = document.getElementById('pagination');
      container.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => {
          currentPage = i;
          renderPage(i);
          renderPagination();
        };
        container.appendChild(btn);
      }
    }

window.deleteEntry = (key) => {
  const inputPw = document.getElementById(`pw-${key}`).value.trim();
  if (!inputPw) {
    alert("비밀번호를 입력해주세요.");
    return;
  }

  const entryRef = ref(db, `guestbook/${key}`);

  update(entryRef, {
    name: null,
    message: null,
    password: inputPw
  })
    .then(() => alert("삭제되었습니다."))
    .catch(() => alert("비밀번호가 틀렸거나 삭제 권한이 없습니다."));
};

  </script>
</body>
</html>
