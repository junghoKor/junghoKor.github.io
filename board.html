<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>방명록</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, textarea { display: block; margin: 10px 0; width: 300px; }
    .entry { margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    .entry-header {
      position: relative;
      margin-bottom: 5px;
      height: 30px;
    }
    .entry-header strong {
      position: absolute;
      left: 0;
      top: 0;
    }
    .entry-controls {
      position: absolute;
      left: 300px;
      top: 0;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .pw-input {
      width: 50px;
      padding: 2px;
    }
    .entry-message {
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <h1>방명록</h1>
  <input type="text" id="name" placeholder="이름">
  <textarea id="message" placeholder="메시지"></textarea>
  <input type="password" id="password" placeholder="비밀번호">
  <button onclick="submitEntry()">등록</button>

  <h2>메시지 목록</h2>
  <div id="entries"></div>

  <script type="module">
    import { db, ref, push, onChildAdded, remove } from './guestbook_cdn.js';

    window.submitEntry = () => {
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !message) {
        alert("이름과 메시지를 모두 입력해주세요.");
        return;
      }

      if (!password) {
        alert("비밀번호를 입력해야 등록할 수 있습니다.");
        return;
      }

      push(ref(db, 'guestbook'), { name, message, password });
      document.getElementById('name').value = '';
      document.getElementById('message').value = '';
      document.getElementById('password').value = '';
    };

    const entriesRef = ref(db, 'guestbook');
    onChildAdded(entriesRef, (snapshot) => {
      const entry = snapshot.val();
      const key = snapshot.key;
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <div class="entry-header">
          <strong>${entry.name}</strong>
          <div class="entry-controls">
            <input type="password" id="pw-${key}" class="pw-input" placeholder="PW">
            <button onclick="deleteEntry('${key}', '${entry.password}')">삭제</button>
          </div>
        </div>
        <div class="entry-message">${entry.message}</div>
      `;
      document.getElementById('entries').prepend(div);
    });

    window.deleteEntry = (key, originalPw) => {
      const inputPw = document.getElementById(`pw-${key}`).value;
      if (inputPw === originalPw) {
        remove(ref(db, `guestbook/${key}`));
        alert("삭제되었습니다.");
        location.reload();
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    };
  </script>
</body>
</html>
